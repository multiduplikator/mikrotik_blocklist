version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "07:00"
      timezone: "America/Los_Angeles"
    labels:
      - "actions"
    # No cooldown: with interval=weekly and no cooldown, dependabot checks
    # every week as intended. (A 7-day cooldown on top of a weekly interval
    # could skip a cycle.)
