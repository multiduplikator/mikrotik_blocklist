name: update_blocklist

on:
  schedule:
    # Three times an hour, away from the full hour. GitHub's scheduler is
    # best-effort: it delays and drops runs (worst at the start of each
    # hour). Frequent tries mean a dropped one costs 20 minutes; the "due"
    # job keeps the actual regeneration cadence at ~3 hours.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

# Least-privilege default; jobs opt into what they need below.
permissions: {}

concurrency:
  group: update_blocklist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Scheduled runs regenerate only if the lists are older than MIN_AGE_MIN
  # (measured from the newest commit that changed them). Manual runs always
  # regenerate. If the age can't be determined, regenerate.
  due:
    # 1-vCPU container runner: enough for these short jobs. It has
    # shellcheck, curl, git, gh and mawk; tests/run.sh skips the awks it
    # lacks (gawk, busybox), so those are only tested locally.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check if a regeneration is due
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MIN_AGE_MIN: 150
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&path=blocklist_l.txt&per_page=1" \
              --jq '.[0].commit.committer.date') || last=""
            if [ -n "$last" ] && last_s=$(date -u -d "$last" +%s); then
              age=$(( ($(date -u +%s) - last_s) / 60 ))
              echo "Lists last changed $last ($age min ago, minimum $MIN_AGE_MIN)."
              [ "$age" -ge "$MIN_AGE_MIN" ] || run=false
            else
              echo "Could not determine the age of the lists; regenerating."
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-slim
    # ubuntu-slim kills jobs after 15 minutes regardless of this setting.
    # Normal runs take ~15 s; generate.sh's worst case is ~7.5 min.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Clone Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the current lists are needed (generate.sh compares against
          # them); the full history is ~2 GB and took minutes to clone.
          fetch-depth: 1
          persist-credentials: false

      - name: Lint
        run: shellcheck -s sh generate.sh tests/run.sh tests/config.sh

      - name: Test
        run: sh tests/run.sh

      # Downloads the feeds, builds and validates the lists, and only
      # replaces the committed files if every check passes. Writes the
      # per-feed and per-list step summary itself.
      - name: Generate Blocklists
        run: sh ./generate.sh

      # Runs on other branches stop here (a dry run): only main publishes.
      - name: Commit Generated Files
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add blocklist*.txt blocklist*.rsc blocklist*.json
          if git diff --cached --quiet; then
            echo "Lists unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate blocklists - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      # If main moved during the run, the push is rejected and the job
      # fails; the next scheduled try regenerates on top of the new main.
      - name: Push Changes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
