name: update_blocklist

on:
  schedule:
    # Running every 3h
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Least-privilege default; the build job opts into contents:write below.
permissions: {}

concurrency:
  group: update_blocklist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone Project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check awk
        run: |
          awk --version | head -1 || awk -W version 2>&1 | head -1

      - name: Generate Blocklists
        run: |
          chmod +x ./generate.sh
          ./generate.sh

      - name: Validate Generated Lists
        run: |
          set -euo pipefail

          # Single source of truth for the generated files. Reused by the
          # existence check, the shape checks, the delta check, and the
          # commit step (exported via GITHUB_ENV below).
          MAIN_FILES=(
            blocklist.rsc blocklist.txt blocklist_ga.rsc
            blocklist_l.rsc blocklist_l.txt blocklist_ga_l.rsc
            blocklist_xl.rsc blocklist_xl.txt blocklist_ga_xl.rsc
          )
          RSC_FILES=(blocklist.rsc blocklist_l.rsc blocklist_xl.rsc)
          GA_FILES=(blocklist_ga.rsc blocklist_ga_l.rsc blocklist_ga_xl.rsc)
          TXT_FILES=(blocklist.txt blocklist_l.txt blocklist_xl.txt)

          for f in "${MAIN_FILES[@]}"; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done

          # Shape checks: only expected RouterOS commands appear.
          for f in "${RSC_FILES[@]}"; do
            head -n1 "$f" | grep -qxF "/ip firewall address-list" \
              || { echo "::error::$f header wrong"; exit 1; }
            if tail -n +2 "$f" | grep -vE '^add list=new_blocklist address="[0-9./]+" comment="blocklist"$' | head -1 | grep -q .; then
              echo "::error::$f contains unexpected line(s)"; exit 1;
            fi
          done
          for f in "${GA_FILES[@]}"; do
            head -n1 "$f" | grep -qxF ':global newips [:toarray ""]' \
              || { echo "::error::$f header wrong"; exit 1; }
            if tail -n +2 "$f" | grep -vE '^:set newips \(\$newips,"[0-9./]+"\)$' | head -1 | grep -q .; then
              echo "::error::$f contains unexpected line(s)"; exit 1;
            fi
          done

          # Absolute bounds sanity check.
          std=$(wc -l < blocklist.txt)
          lg=$(wc -l < blocklist_l.txt)
          xl=$(wc -l < blocklist_xl.txt)
          echo "Entries: standard=$std large=$lg xl=$xl"
          [ "$std" -ge 8000  ] && [ "$std" -le 60000 ]  || { echo "::error::standard out of range ($std)"; exit 1; }
          [ "$lg"  -ge 15000 ] && [ "$lg"  -le 80000 ]  || { echo "::error::large out of range ($lg)"; exit 1; }
          [ "$xl"  -ge 40000 ] && [ "$xl"  -le 150000 ] || { echo "::error::xl out of range ($xl)"; exit 1; }

          # Delta regression: fail on abrupt changes vs the previous commit.
          # Check the .txt (human-readable) AND the .rsc (what routers load)
          # so a silently-dropped feed can't ship a changed list while the
          # .txt stays in range.
          delta_check() {
            local f="$1" thresh="$2"
            local new; new=$(wc -l < "$f")
            if git cat-file -e HEAD:"$f" 2>/dev/null; then
              local old; old=$(git show "HEAD:$f" | wc -l)
              if [ "$old" -gt 0 ]; then
                local pct
                pct=$(awk -v o="$old" -v n="$new" 'BEGIN{d=(n-o)/o*100; if(d<0)d=-d; printf "%d", d+0.5}')
                echo "  $f: $old -> $new (delta ${pct}%)"
                if [ "$pct" -gt "$thresh" ]; then
                  echo "::error::$f delta ${pct}% exceeds ${thresh}% threshold"; exit 1
                fi
              fi
            fi
          }
          for f in "${TXT_FILES[@]}"; do delta_check "$f" 30; done
          for f in "${RSC_FILES[@]}"; do delta_check "$f" 30; done

          # Persist counts + the file list for the summary and commit steps.
          {
            echo "STD=$std"
            echo "LG=$lg"
            echo "XL=$xl"
            echo "MAIN_FILES=${MAIN_FILES[*]}"
          } >> "$GITHUB_ENV"

      - name: Write Step Summary
        if: always()
        run: |
          {
            echo "# Blocklist regeneration"
            echo ""
            echo "| List | Entries |"
            echo "|---|---|"
            echo "| Standard | ${STD:-?} |"
            echo "| Large | ${LG:-?} |"
            echo "| Extra Large | ${XL:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit Generated Files
        run: |
          set -euo pipefail
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git config --local user.email "noreply@github.actions.bot"
          git config --local user.name "GitHub Actions"
          # Reuse the file list exported by the Validate step (single source
          # of truth) instead of re-listing the files here.
          read -r -a FILES <<< "$MAIN_FILES"
          git add "${FILES[@]}"
          git status
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate blocklists - $NOW"
          fi

      - name: Push Changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main