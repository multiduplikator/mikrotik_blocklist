name: update_blocklist

on:
  schedule:
    # Running every 3h
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Least-privilege default; the build job opts into contents:write below.
permissions: {}

concurrency:
  group: update_blocklist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Worst case is ~14 min: two download passes, each up to ~6 min with
    # curl's retries, plus the pause between them.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Clone Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the current lists are needed (generate.sh compares against
          # them); the full history is ~2 GB and took minutes to clone.
          fetch-depth: 1
          persist-credentials: false

      - name: Lint
        run: shellcheck -s sh generate.sh tests/run.sh tests/config.sh

      - name: Test
        run: sh tests/run.sh

      # Downloads the feeds, builds and validates the lists, and only
      # replaces the committed files if every check passes. Writes the
      # per-feed and per-list step summary itself.
      - name: Generate Blocklists
        run: sh ./generate.sh

      # Runs on other branches stop here (a dry run): only main publishes.
      - name: Commit Generated Files
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add blocklist*.txt blocklist*.rsc blocklist*.json
          if git diff --cached --quiet; then
            echo "Lists unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate blocklists - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Push Changes
        if: github.ref == 'refs/heads/main'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
